name: pipeline

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes, off the top of the hour
  workflow_dispatch:
    inputs:
      force_anomaly:
        description: Inject a specific anomaly into this run's batch (drill)
        type: choice
        default: none
        options: [none, schema_new_column, schema_renamed_column, schema_type_change, null_burst,
                  duplicate_burst, price_spike, volume_drop, clock_skew_future, clock_skew_past]

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ECOM_DATABASE_URL: ${{ secrets.ECOM_DATABASE_URL }}
      ECOM_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.force_anomaly != 'none' && 'drill' || github.event_name }}
      ECOM_RAW_ZONE: ${{ github.workspace }}/raw_zone
      ECOM_SUMMARY_PATH: ${{ github.workspace }}/summary.json
      FORCE_ANOMALY: ${{ inputs.force_anomaly || 'none' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Generate, ingest, dbt build, quality checks
        run: |
          args=()
          if [ "$FORCE_ANOMALY" != "none" ]; then args+=(--force-anomaly "$FORCE_ANOMALY"); fi
          uv run python -m pipeline.run "${args[@]}"
      - name: Keep raw zone batch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-zone-${{ github.run_id }}
          path: raw_zone/
          retention-days: 7
          if-no-files-found: ignore
      - name: Job summary
        if: always()
        run: |
          if [ -f summary.json ]; then
            { echo '### Pipeline run'; echo '```json'; jq . summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/alert.sh failed
      - name: Close alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/alert.sh recovered
