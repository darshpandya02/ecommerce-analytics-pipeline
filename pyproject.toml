[project]
name = "ecommerce-analytics-pipeline"
version = "0.1.0"
description = "Batch-incremental e-commerce analytics pipeline: synthetic event source, Parquet raw zone, Postgres warehouse, dbt models, Great Expectations checks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-postgres>=1.11.0",
    "great-expectations>=1.23.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
